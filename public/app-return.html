<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Returning to Royal Tiara</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5ead8;
           font: 16px/1.5 system-ui, sans-serif; color: #201e1d; text-align: center; padding: 24px; box-sizing: border-box; }
    a { color: #8c491a; }
  </style>
</head>
<body>
  <!--
    Live PayFast refuses return addresses at "localhost", where both apps live
    (https://localhost on Android, capacitor://localhost on iPhone). So PayFast
    returns here (inside the app) and this page hands over to the app's own
    screen. Only the payment pages for a Royal Tiara order, and the joining-fee
    page, are ever opened.
  -->
  <p id="msg">Returning to the Royal Tiara app...</p>
  <script>
    var to = new URLSearchParams(location.search).get('to') || ''
    var app = /Android/.test(navigator.userAgent) ? 'https://localhost' : 'capacitor://localhost'
    if (/^\/payment\/(return|cancel)\?order=RT-\d+$/.test(to) || /^\/join-fee\?(paid|cancelled)=1$/.test(to)) {
      location.replace(app + to)
    }
    // Opened outside the app (e.g. in a desktop browser): offer the website instead.
    setTimeout(function () {
      document.getElementById('msg').innerHTML =
        'If nothing happens, open the Royal Tiara app. <br /><a href="/orders">Or continue on the website</a>'
    }, 2500)
  </script>
</body>
</html>
