<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Returning to Royal Tiara</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5ead8;
           font: 16px/1.5 system-ui, sans-serif; color: #201e1d; text-align: center; padding: 24px; box-sizing: border-box; }
    a { color: #8c491a; }
  </style>
</head>
<body>
  <!--
    PayFast only accepts https:// return addresses, but the iPhone app lives at
    capacitor://localhost. On iPhone, PayFast returns here (inside the app) and this
    page hands over to the app's own payment screen. Only the two payment pages,
    for a Royal Tiara order number, are ever opened.
  -->
  <p id="msg">Returning to the Royal Tiara app...</p>
  <script>
    var to = new URLSearchParams(location.search).get('to') || ''
    if (/^\/payment\/(return|cancel)\?order=RT-\d+$/.test(to)) {
      location.replace('capacitor://localhost' + to)
    }
    // Opened outside the app (e.g. in a desktop browser): offer the website instead.
    setTimeout(function () {
      document.getElementById('msg').innerHTML =
        'If nothing happens, open the Royal Tiara app. <br /><a href="/orders">Or continue on the website</a>'
    }, 2500)
  </script>
</body>
</html>
