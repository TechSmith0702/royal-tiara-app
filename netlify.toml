# How Netlify builds and serves the Royal Tiara trade app.

[build]
  command = "npm run build"
  publish = "dist"
  # Skip the build (and its credits) when a push only touches the Android app.
  # Exit code 0 tells Netlify there is nothing to rebuild.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)android' ':(exclude)capacitor.config.json' ':(exclude).env.android' ':(exclude)scripts/generate-android-icons.py'"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every address is handled by index.html so that deep links
# (an invoice, a product, the PayFast return page) work on a hard refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Hashed build files never change, so they can be cached hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
